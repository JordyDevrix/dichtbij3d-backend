services:
  postgres:
    image: postgres:16-alpine
    container_name: dichtbij3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dichtbij3d
      POSTGRES_USER: dichtbij3d
      POSTGRES_PASSWORD: dichtbij3d
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dichtbij3d -d dichtbij3d"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: dichtbij3d-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dichtbij3d
      MINIO_ROOT_PASSWORD: dichtbij3d-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  miniodata:
