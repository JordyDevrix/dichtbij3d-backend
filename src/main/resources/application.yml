server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: always

spring:
  application:
    name: dichtbij3d-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dichtbij3d}
    username: ${DB_USER:dichtbij3d}
    password: ${DB_PASSWORD:dichtbij3d}
    hikari:
      maximum-pool-size: 15
      pool-name: dichtbij3d-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:${SMTP_HOST:}}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:${SMTP_PORT:587}}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${SMTP_USERNAME:${SMTP_USER:}}}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${SMTP_PASSWORD:${SMTP_PASS:}}}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:${MAIL_SMTP_AUTH:${SMTP_AUTH:true}}}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:${MAIL_SMTP_STARTTLS:${SMTP_STARTTLS:true}}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    nl.dichtbij3d: INFO
    org.springframework.security: WARN

dichtbij3d:
  jwt:
    # Override in production: `export DICHTBIJ3D_JWT_SECRET=...` (>= 64 random chars)
    secret: ${DICHTBIJ3D_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    issuer: dichtbij3d
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    mfa-challenge-ttl: PT5M
  cors:
    # Comma-separated list; override in production with the public site origin.
    allowed-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000,http://127.0.0.1:8081}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: Dichtbij3D
    # Must match the exact origin(s) the browser uses, scheme and port included.
    origins: ${WEBAUTHN_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:dichtbij3d}
    secret-key: ${MINIO_SECRET_KEY:dichtbij3d-secret}
    bucket: ${MINIO_BUCKET:dichtbij3d}
    # When MinIO is unreachable the service transparently falls back to local disk storage.
    fallback-directory: ${STORAGE_FALLBACK_DIR:./.storage}
  views:
    # A single viewer can only add one view per advert within this window.
    dedup-window: PT12H
    # Minimum dwell time (ms) the client must report before a view is counted.
    min-dwell-millis: 1500
  admin:
    # Bootstrap admin, created on first startup if it does not exist yet.
    email: ${ADMIN_EMAIL:admin@dichtbij3d.nl}
    password: ${ADMIN_PASSWORD:Admin123!}
  demo-data:
    enabled: ${DEMO_DATA:true}
  mail:
    from: ${MAIL_FROM:${SPRING_MAIL_FROM:noreply@jordydevrix.com}}
    from-name: ${MAIL_FROM_NAME:${SPRING_MAIL_FROM_NAME:Dichtbij3D}}
    frontend-url: ${FRONTEND_URL:${PUBLIC_URL:http://localhost:8081}}
    reset-token-ttl: ${MAIL_RESET_TOKEN_TTL:PT30M}
